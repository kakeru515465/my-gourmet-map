<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食図鑑 - 詳細情報</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container zukan-page-container">
        <div class="zukan-panel" id="myZukan" style="display: flex;">
            
            <div class="zukan-left">
                <span class="area-badge" id="zukan-area">読み込み中...</span>
                <h2 class="zukan-shop-name" id="zukan-shop-name">店名</h2>
                <p class="zukan-meta"><strong>ジャンル：</strong> <span id="zukan-genre">-</span></p>
                
                <div class="zukan-buttons">
                    <a href="#" target="_blank" class="official-link-btn" id="zukan-link">
                        公式サイトを見る ➔
                    </a>
                    <a href="#" target="_blank" class="official-link-btn map" id="zukan-map">
                        Googleマップに移動 ➔
                    </a>
                </div>
            </div>
            
            <div class="zukan-right">
                <h3 class="history-title">📅 訪問の歴史（思い出）</h3>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shop');

        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('JSONファイルの読み込みに失敗しました');
                }
                return response.json();
            })
            .then(shopDatabase => {
                const shopData = shopDatabase[shopId];

                if (shopData) {
                    document.getElementById('zukan-shop-name').textContent = shopData.name;
                    document.getElementById('zukan-area').textContent = shopData.city;
                    document.getElementById('zukan-genre').textContent = shopData.genre;

                    const historyList = document.getElementById('history-list');
                    
                    const linkBtn = document.getElementById('zukan-link');
                    if (shopData.url && shopData.url !== '#') {
                        linkBtn.href = shopData.url;
                        linkBtn.style.display = 'block';
                    } else {
                        linkBtn.style.display = 'none';
                    }

                    const mapBtn = document.getElementById('zukan-map');
                    if (shopData.map && shopData.map !== '#') {
                        mapBtn.href = shopData.map;
                        mapBtn.style.display = 'block';
                    } else {
                        mapBtn.style.display = 'none';
                    }

                    shopData.history.forEach((item, index) => {
                        let imagesHTML = '';
                        let prevBtnHTML = '';
                        let nextBtnHTML = '';

                        if (item.photos && item.photos.length > 0) {
                            item.photos.forEach((photoPath, photoIndex) => {
                                const activeClass = photoIndex === 0 ? 'active' : '';
                                imagesHTML += `
                                    <img src="${photoPath}" class="visit-img ${activeClass}" alt="${item.menu}" 
                                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="photo-placeholder" style="display:none;">📷 写真のファイルが見つかりません</div>
                                `;
                            });

                            if (item.photos.length > 1) {
                                prevBtnHTML = `<button class="slider-btn prev" onclick="moveSlide(${index}, -1)">❮</button>`;
                                nextBtnHTML = `<button class="slider-btn next" onclick="moveSlide(${index}, 1)">❯</button>`;
                            }
                        } else {
                            imagesHTML = `<div class="photo-placeholder">📷 写真なし</div>`;
                        }

                        const cardHTML = `
                            <div class="history-card" id="history-card-${index}">
                                <div class="history-header">
                                    <span class="visit-date">${item.date}</span>
                                    <span class="menu-name">食べたもの：${item.menu}</span>
                                </div>
                                <div class="photo-container slider-container" 
                                     data-card-index="${index}"
                                     data-touch-startX="0">
                                    ${prevBtnHTML}
                                    <div class="slider-wrapper">
                                        ${imagesHTML}
                                    </div>
                                    ${nextBtnHTML}
                                </div>
                                <p class="visit-comment">${item.comment}</p>
                            </div>
                        `;
                        historyList.innerHTML += cardHTML;
                    });

                    // 📱 スマホ用タッチスワイプ（指での左右スライド）イベントの追加
                    initTouchSliders();

                } else {
                    document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>⚠️ お店のデータが見つかりませんでした。</h1>";
                }
            })
            .catch(error => {
                console.error(error);
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>⚠️ data.json を読み込めません。</h1>";
            });

        function moveSlide(cardIndex, direction) {
            const card = document.getElementById(`history-card-${cardIndex}`);
            const imgs = Array.from(card.querySelectorAll('.visit-img'));
            if (imgs.length <= 1) return;

            let currentIndex = imgs.findIndex(img => img.classList.contains('active'));
            imgs[currentIndex].classList.remove('active');

            currentIndex += direction;
            if (currentIndex >= imgs.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = imgs.length - 1;

            imgs[currentIndex].classList.add('active');
        }

        // スマホでのスワイプ操作を可能にする関数
        function initTouchSliders() {
            document.querySelectorAll('.slider-container').forEach(container => {
                const cardIndex = container.getAttribute('data-card-index');

                container.addEventListener('touchstart', (e) => {
                    container.dataset.touchStartX = e.touches[0].clientX;
                }, { passive: true });

                container.addEventListener('touchend', (e) => {
                    const startX = parseFloat(container.dataset.touchStartX);
                    const endX = e.changedTouches[0].clientX;
                    const diffX = startX - endX;

                    // 50px以上スワイプしたら画像を切り替える
                    if (Math.abs(diffX) > 50) {
                        if (diffX > 0) {
                            moveSlide(cardIndex, 1);  // 左スワイプで次へ
                        } else {
                            moveSlide(cardIndex, -1); // 右スワイプで前へ
                        }
                    }
                }, { passive: true });
            });
        }
    </script>
</body>
</html>
