<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007bff">
    <title>飯ログマップ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>📍 飯ログマップ</h1>
            <p>今まで行ったご飯屋さんの備忘録</p>
        </header>

        <main>
            <section class="map-container">
                <h3>🗺️ エリアを選択</h3>
                <div class="area-buttons">
                    <a href="#asahikawa" class="btn-area">旭川</a>
                    <a href="#sapporo" class="btn-area">札幌</a>
                    <a href="#ebetu" class="btn-area">江別</a>
                </div>
            </section>

            <!-- タグ切り替えボタンのエリア -->
            <section class="filter-container">
                <div class="filter-head">
                    <h3>📌 マイマップ リストから探す</h3>
                    <button id="btn-reset" class="btn-reset" type="button">🔄 リセット</button>
                </div>
                <div class="tag-filters">
                    <!-- 8種の特製タグ -->
                    <button class="btn-tag" type="button" data-tag="sapporo-saikyo-ramen">🔥 札幌最強ラーメン決定戦</button>
                    <button class="btn-tag" type="button" data-tag="asahikawa-son">🐻 旭川食べなきゃ損</button>
                    <button class="btn-tag" type="button" data-tag="sapporo-miso">🌽 札幌味噌ラーメン</button>
                    <button class="btn-tag" type="button" data-tag="ebetsu-son">🧱 江別食べなきゃ損</button>
                    <button class="btn-tag" type="button" data-tag="sapporo-ninki-ramen">🥇 札幌人気ラーメン</button>
                    <button class="btn-tag" type="button" data-tag="sapporo-chuka">🥟 札幌町中華</button>
                    <button class="btn-tag" type="button" data-tag="asahikawa-ramen">🍜 旭川ラーメン</button>
                    <button class="btn-tag" type="button" data-tag="sapporo-chahan">🍚 札幌炒飯</button>
                </div>

                <h3 class="filter-sub">🔍 基本ジャンル</h3>
                <div class="tag-filters">
                    <!-- 基本ジャンル：data.json の genre に含まれる文字で判定します -->
                    <button class="btn-tag" type="button" data-genre="ラーメン">ラーメン</button>
                    <button class="btn-tag" type="button" data-genre="炒飯">炒飯</button>
                    <button class="btn-tag" type="button" data-genre="中華">中華料理</button>
                </div>
                <p id="filter-status" class="filter-status" hidden></p>
            </section>

            <section id="ebetu" class="area-section" data-city="江別市">
                <h2 class="section-title">🌾 江別エリア <span class="city-count" style="font-size: 0.85rem; font-weight: normal; color: #666; margin-left: 8px;"></span></h2>
                <div class="shop-grid">
                    
                    <shop-card shop="sarasen_no_mugi" tags="ebetsu-son"></shop-card>
